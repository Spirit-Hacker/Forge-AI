services:
  postgres:
    image: postgres:17
    container_name: forge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge

    ports:
      - "5433:5432"

    volumes:
      - forge-postgres-data:/var/lib/postgresql/data
  preview-gateway:
    image: node:22-bookworm
    container_name: forge-preview-gateway
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./services/preview-gateway:/app
    command: sh -lc "npm install && npm start"
    environment:
      PORT: "4000"
    ports:
      - "4001:4000"
    networks:
      - forge-preview
volumes:
  forge-postgres-data:

networks:
  forge-preview:
    external: true